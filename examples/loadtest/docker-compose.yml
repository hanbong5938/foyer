# Load / multi-instance test stack: 2 gateway instances behind nginx, 1 booking-service, 1 Redis, k6.
#
#   ./gradlew :examples:gateway:bootJar :examples:booking-service:bootJar
#   cd examples/loadtest
#   docker compose up -d --build redis booking gateway-1 gateway-2 nginx
#   docker compose run --rm k6
#   ./report.sh     # per-instance admit counters + Redis slowlog
#   docker compose down
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--slowlog-log-slower-than", "1000"]
    ports: ["16379:6379"]

  booking:
    build: { context: .., dockerfile: loadtest/Dockerfile, args: { JAR: booking-service/build/libs/booking-service-0.1.0-SNAPSHOT.jar } }
    environment:
      FOYER_REDIS_URI: redis://redis:6379
      # Map keys with dashes cannot be set through plain env vars; JSON config can.
      SPRING_APPLICATION_JSON: '{"foyer":{"rooms":{"concert-2026":{"rate":${RATE:-200},"queue-ttl":"60s"}}}}'
    depends_on: [redis]

  gateway-1: &gateway
    build: { context: .., dockerfile: loadtest/Dockerfile, args: { JAR: gateway/build/libs/gateway-0.1.0-SNAPSHOT.jar } }
    environment: &gateway-env
      FOYER_REDIS_URI: redis://redis:6379
      SPRING_APPLICATION_JSON: '{"foyer":{"rooms":{"concert-2026":{"rate":${RATE:-200},"queue-ttl":"60s"}}}}'
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: booking
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://booking:8081
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/booking/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0: Foyer=concert-2026
    depends_on: [redis, booking]
    ulimits: { nofile: { soft: 65536, hard: 65536 } }
    ports: ["18081:8080"]

  gateway-2:
    <<: *gateway
    ports: ["18082:8080"]

  nginx:
    image: nginx:alpine
    ulimits: { nofile: { soft: 65536, hard: 65536 } }
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["18080:80"]
    depends_on: [gateway-1, gateway-2]

  k6:
    image: grafana/k6:latest
    volumes: ["./visitors.js:/visitors.js:ro", "./out:/out"]
    environment:
      BASE: http://nginx
      VISITORS: ${VISITORS:-10000}
      RATE: ${RATE:-200}
    command: ["run", "--summary-export=/out/summary.json", "/visitors.js"]
    depends_on: [nginx]
