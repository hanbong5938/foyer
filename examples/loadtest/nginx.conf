worker_processes 2;
worker_rlimit_nofile 65536;
events { worker_connections 8192; }
http {
  upstream gateways {
    server gateway-1:8080;
    server gateway-2:8080;
    keepalive 256;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
